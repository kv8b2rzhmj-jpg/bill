<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="记账">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7">
<title>记账</title>
<style>
:root{
  --bg:#f2f2f7;--card:#fff;--text:#1c1c1e;--sub:#8e8e93;--line:#e8e8ed;
  --blue:#007aff;--red:#ff3b30;--green:#34c759;--orange:#ff9500;--purple:#af52de;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  background:var(--bg);color:var(--text);font-size:16px;overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer}

#main{padding:12px 12px calc(84px + env(safe-area-inset-bottom))}
.page{display:none}
.page.active{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

#tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  height:calc(56px + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(255,255,255,.94);backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:flex;
}
#tabbar button{
  flex:1;border:0;background:none;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;
  font-size:10px;color:var(--sub);padding:0;transition:color .15s;
}
#tabbar button.on{color:var(--blue)}
#tabbar .ico{font-size:20px;line-height:1}

#fab{
  position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));
  width:56px;height:56px;border-radius:28px;border:0;z-index:60;
  background:linear-gradient(135deg,#0a84ff,#0071e3);color:#fff;font-size:30px;font-weight:300;
  box-shadow:0 6px 20px rgba(0,122,255,.42);
  display:flex;align-items:center;justify-content:center;padding-bottom:4px;
  transition:transform .12s;
}
#fab:active{transform:scale(.92)}

.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;
  box-shadow:0 1px 2px rgba(0,0,0,.04)}
.cardTitle{font-size:13px;color:var(--sub);font-weight:600;margin-bottom:10px;letter-spacing:.3px}

.hero{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;
  box-shadow:0 1px 2px rgba(0,0,0,.04)}
.monthNav{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:8px}
.monthNav button{border:0;background:none;font-size:22px;color:var(--blue);padding:0 8px;line-height:1}
.monthNav span{font-size:15px;font-weight:600;min-width:110px;text-align:center}
.bigNum{font-size:38px;font-weight:700;text-align:center;letter-spacing:-1px;
  font-variant-numeric:tabular-nums;margin:2px 0 4px}
.bigLabel{text-align:center;font-size:12px;color:var(--sub);margin-bottom:10px}
.subNums{display:flex;justify-content:space-around;padding-top:10px;border-top:1px solid var(--line)}
.subNums div{text-align:center;font-size:11px;color:var(--sub)}
.subNums b{display:block;font-size:15px;color:var(--text);margin-top:3px;font-variant-numeric:tabular-nums}

.budgetWrap{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.bar{height:8px;border-radius:4px;background:#e8e8ed;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:4px;
  background:linear-gradient(90deg,#34c759,#30d158);transition:width .35s ease}
.bar i.warn{background:linear-gradient(90deg,#ff9500,#ff9f0a)}
.bar i.over{background:linear-gradient(90deg,#ff3b30,#ff453a)}
.budgetText{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:6px}

/* ===== 日期分组 ===== */
.dayGroup{background:#fff;border-radius:12px;margin-bottom:10px;overflow:hidden;
  box-shadow:0 1px 2px rgba(0,0,0,.04)}
.dayHeader{display:flex;align-items:center;padding:12px 14px;cursor:pointer}
.dayHeader:active{background:#fafafa}
.dayDate{font-weight:600;font-size:14px;flex-shrink:0}
.daySummary{flex:1;text-align:right;font-size:12px;color:var(--sub);
  margin:0 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dayArrow{color:var(--sub);font-size:10px;width:14px;text-align:center}
.dayBody{border-top:1px solid var(--line)}

.rec{display:flex;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line)}
.dayBody .rec:last-child{border-bottom:0}
.rec .ico{width:38px;height:38px;border-radius:10px;background:#f2f2f7;
  display:flex;align-items:center;justify-content:center;font-size:16px;margin-right:11px;flex-shrink:0}
.rec .mid{flex:1;min-width:0}
.rec .t1{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .t2{font-size:11px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .amt{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;flex-shrink:0;margin-left:8px}
.rec .amt.exp{color:var(--text)}
.rec .amt.inc{color:var(--green)}
.rec .amt.tra{color:var(--blue)}
.recEdit{border:0;background:none;color:var(--blue);font-size:14px;padding:6px 2px 6px 6px}
.recDel{border:0;background:none;color:#c7c7cc;font-size:18px;padding:4px 0 4px 8px;line-height:1}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:28px 0}

canvas{width:100%;display:block}
.rankRow{display:flex;align-items:center;margin-bottom:10px;font-size:13px}
.rankRow .nm{width:52px;flex-shrink:0;color:var(--text)}
.rankRow .track{flex:1;height:20px;background:#f2f2f7;border-radius:6px;overflow:hidden;margin:0 8px}
.rankRow .fill{height:100%;border-radius:6px;transition:width .4s ease}
.rankRow .vl{width:74px;text-align:right;font-variant-numeric:tabular-nums;color:var(--sub);flex-shrink:0}

.acc{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.acc:last-child{border-bottom:0}
.acc .nm{flex:1;font-size:15px;font-weight:500}
.acc .bl{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;margin-right:10px}
.acc .del{border:0;background:none;color:var(--sub);font-size:13px;padding:4px 6px}
.totalCard{background:linear-gradient(135deg,#1c1c1e,#3a3a3c);color:#fff;
  border-radius:16px;padding:20px;margin-bottom:12px}
.totalCard .lbl{font-size:12px;opacity:.65}
.totalCard .val{font-size:32px;font-weight:700;margin-top:6px;letter-spacing:-.5px;
  font-variant-numeric:tabular-nums}

.setRow{display:flex;align-items:center;justify-content:space-between;
  padding:13px 0;border-bottom:1px solid var(--line);font-size:15px}
.setRow:last-child{border-bottom:0}
.setRow button{border:0;background:#f2f2f7;border-radius:8px;padding:8px 14px;font-size:14px;color:var(--blue)}
.setRow button.danger{color:var(--red)}
.setRow input[type=number]{border:0;text-align:right;font-size:16px;width:130px;
  background:none;color:var(--text);font-variant-numeric:tabular-nums}
.setRow input:focus{outline:none}
.tip{font-size:12px;color:var(--sub);line-height:1.6;padding:4px 0}

.sw{position:relative;width:50px;height:30px;flex-shrink:0}
.sw input{opacity:0;width:100%;height:100%;margin:0;position:absolute;z-index:2}
.sw i{position:absolute;inset:0;background:#e5e5ea;border-radius:15px;transition:.22s;pointer-events:none}
.sw i:after{content:"";position:absolute;width:26px;height:26px;border-radius:13px;background:#fff;
  top:2px;left:2px;transition:.22s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked + i{background:#34c759}
.sw input:checked + i:after{transform:translateX(20px)}

#entrySheet{
  position:fixed;inset:0;z-index:100;background:var(--bg);
  display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);
}
.entryTop{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));
  background:var(--card);border-bottom:1px solid var(--line);gap:6px;
}
.entryTop button{border:0;background:none;font-size:16px;color:var(--blue);padding:6px 2px;flex-shrink:0}
.entryTop button:disabled{color:#c7c7cc}
.entryTop .save{font-weight:600}
.entryTop .cam{font-size:19px;padding:4px 2px}
.seg{display:flex;background:#f2f2f7;border-radius:9px;padding:2px;flex-shrink:0}
.seg button{border:0;background:none;padding:6px 11px;border-radius:7px;font-size:13px;
  color:var(--sub);transition:.15s}
.seg button.on{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}

.entryAmount{
  background:var(--card);padding:18px 20px 16px;text-align:right;
  font-size:42px;font-weight:700;letter-spacing:-1px;
  font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line);
}
.entryAmount span{font-size:22px;font-weight:500;color:var(--sub);margin-right:6px}

.entryBody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px}

.catGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.catGrid button{
  border:0;background:var(--card);border-radius:11px;padding:14px 4px;
  font-size:13px;color:var(--text);transition:.15s;
  display:flex;flex-direction:column;align-items:center;gap:4px;
}
.catGrid button .ci{font-size:20px;line-height:1}
.catGrid button.on{background:var(--blue);color:#fff;box-shadow:0 3px 10px rgba(0,122,255,.3)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{
  border:1px solid var(--line);background:var(--card);border-radius:20px;
  padding:8px 15px;font-size:14px;color:var(--text);transition:.15s;
}
.chips button.on{background:var(--blue);border-color:var(--blue);color:#fff}

.fieldRow{display:flex;align-items:center;gap:10px;margin-top:14px}
.fieldRow label{font-size:13px;color:var(--sub);width:44px;flex-shrink:0}
.fieldRow input{
  flex:1;border:0;background:var(--card);border-radius:10px;padding:11px 13px;
  font-size:15px;color:var(--text);
}
.fieldRow input:focus{outline:2px solid rgba(0,122,255,.35)}

.secTitle{font-size:12px;color:var(--sub);font-weight:600;margin:0 0 8px 2px}

#keypad{
  display:grid;grid-template-columns:repeat(3,1fr);gap:1px;
  background:var(--line);border-top:1px solid var(--line);flex-shrink:0;
}
#keypad button{
  border:0;background:#fff;padding:0;height:56px;font-size:23px;font-weight:400;
  color:var(--text);font-variant-numeric:tabular-nums;
}
#keypad button:active{background:#e5e5ea}
#keypad button.del{font-size:20px}

#lockScreen{
  position:fixed;inset:0;z-index:200;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0 30px;padding-bottom:env(safe-area-inset-bottom);
}
#lockScreen .lockIco{font-size:40px;margin-bottom:14px}
#lockScreen .lockTitle{font-size:16px;color:var(--sub);margin-bottom:26px}
.dots{display:flex;gap:18px;margin-bottom:36px}
.dots i{width:14px;height:14px;border-radius:7px;border:1.5px solid var(--sub);transition:.15s}
.dots i.f{background:var(--text);border-color:var(--text)}
.lockPad{display:grid;grid-template-columns:repeat(3,74px);gap:14px}
.lockPad button{
  width:74px;height:74px;border-radius:37px;border:0;background:var(--card);
  font-size:27px;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.06);
}
.lockPad button:active{background:#e5e5ea}
.lockPad button.blank{background:none;box-shadow:none;pointer-events:none}

.toast{
  position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));
  transform:translate(-50%,10px);z-index:300;
  background:rgba(0,0,0,.82);color:#fff;font-size:14px;
  padding:10px 20px;border-radius:20px;opacity:0;transition:.22s;pointer-events:none;
  white-space:nowrap;max-width:80vw;overflow:hidden;text-overflow:ellipsis;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ===== OCR 遮罩 ===== */
#ocrOverlay{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.55);
  display:flex;align-items:center;justify-content:center;padding:0 30px}
.ocrBox{background:#fff;border-radius:16px;padding:26px 28px;text-align:center;min-width:220px}
.spinner{width:40px;height:40px;border:3px solid #e5e5ea;border-top-color:var(--blue);
  border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ocrText{font-size:15px;color:var(--text);margin-bottom:6px;font-weight:500}
.ocrProgress{font-size:12px;color:var(--sub);margin-bottom:16px;min-height:16px}
.ocrBox button{border:0;background:#f2f2f7;border-radius:10px;padding:10px 24px;
  font-size:15px;color:var(--blue)}
</style>
</head>
<body>

<div id="lockScreen" class="hidden">
  <div class="lockIco">🔒</div>
  <div class="lockTitle">请输入密码</div>
  <div class="dots" id="lockDots"><i></i><i></i><i></i><i></i></div>
  <div class="lockPad" id="lockPad"></div>
</div>

<div id="main">
  <section id="page-home" class="page active"></section>
  <section id="page-chart" class="page"></section>
  <section id="page-account" class="page"></section>
  <section id="page-setting" class="page"></section>
</div>

<button id="fab" data-act="fab">+</button>

<nav id="tabbar">
  <button data-act="tab" data-val="home" class="on"><span class="ico">🏠</span>首页</button>
  <button data-act="tab" data-val="chart"><span class="ico">📊</span>图表</button>
  <button data-act="tab" data-val="account"><span class="ico">💳</span>账户</button>
  <button data-act="tab" data-val="setting"><span class="ico">⚙️</span>设置</button>
</nav>

<div id="entrySheet" class="hidden">
  <div class="entryTop">
    <button data-act="closeEntry">取消</button>
    <button class="cam" data-act="ocr" title="识别账单">📷</button>
    <div class="seg" id="entrySeg">
      <button data-act="entryType" data-val="expense">支出</button>
      <button data-act="entryType" data-val="income">收入</button>
      <button data-act="entryType" data-val="transfer">转账</button>
    </div>
    <button class="save" data-act="saveEntry" id="entrySave">保存</button>
  </div>
  <div class="entryAmount"><span>¥</span><b id="entryAmount">0</b></div>
  <div class="entryBody" id="entryBody"></div>
  <div id="keypad"></div>
</div>

<div id="ocrOverlay" class="hidden">
  <div class="ocrBox">
    <div class="spinner"></div>
    <div class="ocrText" id="ocrText">正在识别账单…</div>
    <div class="ocrProgress" id="ocrProgress">首次使用需加载识别模型，请稍候</div>
  </div>
</div>

<input type="file" id="ocrFile" accept="image/*" style="display:none">

<script>
/* =========================================================
   常量 & 状态
   ========================================================= */
const KEY = 'ledger_v2';
const CATS = {
  expense: ['餐饮','交通','购物','居住','通讯','医疗','娱乐','教育','人情','其他'],
  income:  ['工资','奖金','兼职','投资','红包','其他']
};
const CAT_ICON = {
  '餐饮':'🍚','交通':'🚌','购物':'🛍️','居住':'🏠','通讯':'📱','医疗':'💊',
  '娱乐':'🎮','教育':'📚','人情':'🎁','其他':'📦',
  '工资':'💰','奖金':'🏆','兼职':'💼','投资':'📈','红包':'🧧'
};
const ACC_ICON = ['💵','💳','🏦','📱','🪙','💎'];

/* 折叠状态：date -> true(展开) / false(收起) */
let expandedDates = {};
let editingId = null;

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function defaultState(){
  return {
    settings: { pin:'', lock:false, budget:0 },
    accounts: [
      { id: uid(), name:'现金',   initial:0 },
      { id: uid(), name:'微信',   initial:0 },
      { id: uid(), name:'支付宝', initial:0 },
      { id: uid(), name:'银行卡', initial:0 }
    ],
    records: []
  };
}

let state = load();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return defaultState();
    const s = JSON.parse(raw);
    s.settings = Object.assign({ pin:'', lock:false, budget:0 }, s.settings || {});
    s.accounts = Array.isArray(s.accounts) ? s.accounts : [];
    s.records  = Array.isArray(s.records)  ? s.records  : [];
    return s;
  }catch(e){ return defaultState(); }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ toast('保存失败，存储空间可能已满'); }
}

/* =========================================================
   工具函数
   ========================================================= */
const $  = s => document.querySelector(s);
const $$ = s => Array.prototype.slice.call(document.querySelectorAll(s));

const fmt = n => '¥' + Number(n || 0).toFixed(2);
function fmtShort(n){
  n = Number(n) || 0;
  if(Math.abs(n) >= 10000) return '¥' + (n/10000).toFixed(2) + 'w';
  return '¥' + n.toFixed(2);
}
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' +
         String(d.getMonth()+1).padStart(2,'0') + '-' +
         String(d.getDate()).padStart(2,'0');
}
function yesterdayStr(){
  const d = new Date();
  d.setDate(d.getDate() - 1);
  return d.getFullYear() + '-' +
         String(d.getMonth()+1).padStart(2,'0') + '-' +
         String(d.getDate()).padStart(2,'0');
}
function monthLabel(ym){
  const p = ym.split('-');
  return p[0] + '年' + Number(p[1]) + '月';
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}
function hash(s){
  let h = 5381;
  for(let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
  return h.toString(16);
}
/* 三天内可编辑（今天 / 昨天 / 前天 / 大前天） */
function canEditDate(dateStr){
  try{
    const t = new Date(todayStr() + 'T00:00:00');
    const d = new Date(dateStr + 'T00:00:00');
    const diff = Math.round((t - d) / 86400000);
    return diff >= 0 && diff <= 3;
  }catch(e){ return false; }
}

let toastTimer = null;
function toast(msg){
  let el = document.querySelector('.toast');
  if(!el){ el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg;
  requestAnimationFrame(() => el.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

/* =========================================================
   数据计算
   ========================================================= */
let curMonth = todayStr().slice(0,7);

function monthStats(ym){
  let income = 0, expense = 0;
  const byCat = {};
  const list = [];
  state.records.forEach(r => {
    if(!r.date || r.date.slice(0,7) !== ym) return;
    list.push(r);
    if(r.type === 'income') income += Number(r.amount) || 0;
    else if(r.type === 'expense'){
      const a = Number(r.amount) || 0;
      expense += a;
      byCat[r.category] = (byCat[r.category] || 0) + a;
    }
  });
  list.sort((a,b) => (b.date + b.id).localeCompare(a.date + a.id));
  return { income, expense, balance: income - expense, byCat, list };
}

function accountBalance(id){
  const acc = state.accounts.find(a => a.id === id);
  if(!acc) return 0;
  let bal = Number(acc.initial) || 0;
  state.records.forEach(r => {
    const a = Number(r.amount) || 0;
    if(r.type === 'income' && r.accountId === id) bal += a;
    else if(r.type === 'expense' && r.accountId === id) bal -= a;
    else if(r.type === 'transfer'){
      if(r.fromId === id) bal -= a;
      if(r.toId === id) bal += a;
    }
  });
  return bal;
}
function totalAssets(){
  return state.accounts.reduce((s,a) => s + accountBalance(a.id), 0);
}
function accName(id){
  const a = state.accounts.find(x => x.id === id);
  return a ? a.name : '—';
}

/* =========================================================
   渲染：首页（按日期折叠）
   ========================================================= */
function renderHome(){
  const st = monthStats(curMonth);
  const budget = Number(state.settings.budget) || 0;
  const remain = budget - st.expense;
  const pct = budget > 0 ? Math.min(st.expense / budget * 100, 100) : 0;

  let budgetHtml = '';
  if(budget > 0){

          '</span>' +
        '</div>' +
      '</div>';
  }

  /* ---- 按日期分组 ---- */
  const groups = {};
  st.list.forEach(r => {
    if(!groups[r.date]) groups[r.date] = [];
    groups[r.date].push(r);
  });
  const dates = Object.keys(groups).sort().reverse();
  const today = todayStr();

  let listHtml = '';
  if(dates.length === 0){
    listHtml = '<div class="empty">本月还没有记录<br>点右下角 + 开始记账</div>';
  }else{
    dates.forEach(date => {
      listHtml += renderDayGroup(date, groups[date], today);
    });
  }

  $('#page-home').innerHTML =
    '<div class="hero">' +
      '<div class="monthNav">' +
        '<button data-act="prevMonth">‹</button>' +
        '<span>' + monthLabel(curMonth) + '</span>' +
        '<button data-act="nextMonth">›</button>' +
      '</div>' +
      '<div class="bigLabel">本月支出</div>' +
      '<div class="bigNum">' + fmt(st.expense) + '</div>' +
      '<div class="subNums">' +
        '<div>收入<b style="color:var(--green)">' + fmt(st.income) + '</b></div>' +
        '<div>结余<b>' + fmt(st.balance) + '</b></div>' +
      '</div>' +
      budgetHtml +
    '</div>' +
    '<div style="font-size:12px;color:var(--sub);font-weight:600;margin:2px 4px 8px">' +
      '本月记录 (' + st.list.length + ')' +
    '</div>' +
    listHtml;
}

function renderDayGroup(date, recs, today){
  const dayExpense = recs.filter(r => r.type === 'expense')
    .reduce((s, r) => s + Number(r.amount || 0), 0);
  const dayIncome = recs.filter(r => r.type === 'income')
    .reduce((s, r) => s + Number(r.amount || 0), 0);
  const dayTrans = recs.filter(r => r.type === 'transfer')
    .reduce((s, r) => s + Number(r.amount || 0), 0);

  /* 默认：今天展开，其它收起；用户手动改过则用用户的选择 */
  const isExpanded = (expandedDates[date] !== undefined)
    ? expandedDates[date]
    : (date === today);

  let label;
  if(date === today) label = '今天';
  else if(date === yesterdayStr()) label = '昨天';
  else{
    const d = new Date(date + 'T00:00:00');
    const wk = ['日','一','二','三','四','五','六'][d.getDay()];
    label = (d.getMonth()+1) + '月' + d.getDate() + '日 周' + wk;
  }

  const parts = [];
  if(dayExpense > 0) parts.push('支 ' + fmtShort(dayExpense));
  if(dayIncome > 0)  parts.push('收 ' + fmtShort(dayIncome));
  if(dayTrans > 0)   parts.push('转 ' + fmtShort(dayTrans));

  let html = '<div class="dayGroup">';
  html += '<div class="dayHeader" data-act="toggleDay" data-val="' + date + '">';
  html += '<span class="dayDate">' + label + '</span>';
  html += '<span class="daySummary">' + parts.join(' · ') + '</span>';
  html += '<span class="dayArrow">' + (isExpanded ? '▼' : '▶') + '</span>';
  html += '</div>';

  if(isExpanded){
    html += '<div class="dayBody">';
    recs.forEach(r => { html += renderRecItem(r, date); });
    html += '</div>';
  }

  html += '</div>';
  return html;
}

function renderRecItem(r, date){
  const editable = canEditDate(date);
  const editBtn = editable
    ? '<button class="recEdit" data-act="editRec" data-val="' + r.id + '">✎</button>'
    : '';
  const delBtn = editable
    ? '<button class="recDel" data-act="delRec" data-val="' + r.id + '">×</button>'
    : '';

  if(r.type === 'transfer'){
    return '<div class="rec">' +
      '<div class="ico">🔄</div>' +
      '<div class="mid"><div class="t1">转账</div>' +
      '<div class="t2">' + esc(accName(r.fromId)) + ' → ' + esc(accName(r.toId)) +
      (r.note ? ' · ' + esc(r.note) : '') + '</div></div>' +
      '<div class="amt tra">' + fmt(r.amount) + '</div>' +
      editBtn + delBtn + '</div>';
  }

  const isExp = r.type === 'expense';
  const icon = CAT_ICON[r.category] || (isExp ? '📦' : '💰');

  return '<div class="rec">' +
    '<div class="ico">' + icon + '</div>' +
    '<div class="mid"><div class="t1">' + esc(r.category) + '</div>' +
    '<div class="t2">' + esc(accName(r.accountId)) +
    (r.note ? ' · ' + esc(r.note) : '') + '</div></div>' +
    '<div class="amt ' + (isExp ? 'exp' : 'inc') + '">' +
      (isExp ? '-' : '+') + fmt(r.amount) + '</div>' +
    editBtn + delBtn + '</div>';
}

function drawBarChart(canvas, data, color){
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const w = canvas.clientWidth || 320;
  const h = 170;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.height = h + 'px';

  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  const padT = 20, padB = 22, padX = 6;
  const cw = w - padX * 2;
  const ch = h - padT - padB;
  const max = Math.max.apply(null, data.map(d => d.value).concat([1]));
  const slot = cw / data.length;
  const barW = Math.min(slot * 0.5, 34);

  ctx.strokeStyle = '#e8e8ed';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(padX, padT + ch + .5);
  ctx.lineTo(padX + cw, padT + ch + .5);
  ctx.stroke();

  data.forEach((d, i) => {
    const cx = padX + slot * i + slot / 2;
    const bh = max > 0 ? ch * (d.value / max) : 0;
    const y = padT + ch - bh;

    if(d.value > 0){
      const g = ctx.createLinearGradient(0, y, 0, padT + ch);
      g.addColorStop(0, color);
      g.addColorStop(1, 'rgba(0,122,255,.45)');
      ctx.fillStyle = g;
      roundRect(ctx, cx - barW/2, y, barW, Math.max(bh, 3), 5);
      ctx.fill();

      ctx.fillStyle = '#8e8e93';
      ctx.font = '10px -apple-system,sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(
        d.value >= 10000 ? (d.value/10000).toFixed(1) + 'w' : Math.round(d.value),
        cx, y - 5
      );
    }else{
      ctx.fillStyle = '#e8e8ed';
      roundRect(ctx, cx - barW/2, padT + ch - 3, barW, 3, 1.5);
      ctx.fill();
    }

    ctx.fillStyle = '#8e8e93';
    ctx.font = '11px -apple-system,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(d.label, cx, h - 6);
  });
}

function roundRect(ctx, x, y, w, h, r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

/* =========================================================
   OCR 图片识别
   ========================================================= */
function loadTesseract(){
  return new Promise((resolve, reject) => {
    if(window.Tesseract) return resolve(window.Tesseract);
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload = () => resolve(window.Tesseract);
    s.onerror = () => reject(new Error('识别组件加载失败，请检查网络'));
    document.head.appendChild(s);
  });
}

function showOcrOverlay(){
  $('#ocrOverlay').classList.remove('hidden');
  $('#ocrText').textContent = '正在识别账单…';
  $('#ocrProgress').textContent = '首次使用需加载识别模型，请稍候';
}
function hideOcrOverlay(){
  $('#ocrOverlay').classList.add('hidden');
}

async function startOCR(file){
  showOcrOverlay();
  try{
    const T = await loadTesseract();
    $('#ocrProgress').textContent = '正在加载中文识别模型…';

    const worker = await T.createWorker('chi_sim+eng', 1, {
      logger: m => {
        if(m.status === 'recognizing text'){
          $('#ocrText').textContent = '正在识别文字…';
          $('#ocrProgress').textContent = Math.round((m.progress || 0) * 100) + '%';
        }else if(m.status){
          const map = {
            'loading tesseract core': '加载识别核心…',
            'initializing tesseract': '初始化…',
            'loading language traineddata': '加载语言包…',
            'initializing api': '准备识别…'
          };
          $('#ocrProgress').textContent = map[m.status] || m.status;
        }
      }
    });

    const { data: { text } } = await worker.recognize(file);
    await worker.terminate();

    hideOcrOverlay();

    const parsed = parseBillText(text || '');

    if(!parsed.amount){
      toast('未识别出金额，请手动输入');
    }

    openEntry(parsed);

  }catch(e){
    hideOcrOverlay();
    toast('识别失败：' + (e.message || '未知错误'));
    openEntry();
  }
}

/* 从 OCR 文本中提取金额 / 日期 / 备注 */
function parseBillText(text){
  const result = { amount: 0, date: todayStr(), note: '' };

  /* ---- 日期 ---- */
  const patterns = [
    /(\d{4})[-\/年.](\d{1,2})[-\/月.](\d{1,2})/,
    /(\d{4})(\d{2})(\d{2})/
  ];
  for(const p of patterns){
    const m = text.match(p);
    if(m){
      const y = m[1];
      const mo = parseInt(m[2], 10);
      const d  = parseInt(m[3], 10);
      if(mo >= 1 && mo <= 12 && d >= 1 && d <= 31){
        result.date = y + '-' +
          String(mo).padStart(2,'0') + '-' +
          String(d).padStart(2,'0');
        break;
      }
    }
  }

  /* ---- 金额：优先级从高到低 ---- */
  const amounts = [];
  let m;

  // 1. ¥ / ￥ 开头的
  const re1 = /[¥￥]\s*([\d,]+(?:\.\d{1,2})?)/g;
  while((m = re1.exec(text)) !== null){
    const v = parseFloat(m[1].replace(/,/g, ''));
    if(v > 0 && v < 1e7) amounts.push(v);
  }

  // 2. 关键字后面的
  if(amounts.length === 0){
    const kwRe = /(?:实付|实收|合计|总计|总额|金额|支付|付款|消费|订单)[：:\s]*[¥￥]?\s*([\d,]+(?:\.\d{1,2})?)/g;
    while((m = kwRe.exec(text)) !== null){
      const v = parseFloat(m[1].replace(/,/g, ''));
      if(v > 0 && v < 1e7) amounts.push(v);
    }
  }

  // 3. 退而求其次：带小数的数字
  if(amounts.length === 0){
    const re2 = /(\d{1,3}(?:,\d{3})+\.\d{1,2}|\d+\.\d{1,2})/g;
    while((m = re2.exec(text)) !== null){
      const v = parseFloat(m[1].replace(/,/g, ''));
      if(v > 0 && v < 1e7) amounts.push(v);
    }
  }

  if(amounts.length > 0){
    // 账单金额通常是最大值，但限制在前 8 个候选中避免误取
    result.amount = Math.round(Math.max.apply(null, amounts.slice(0, 8)) * 100) / 100;
  }

  /* ---- 备注：取最长的非纯数字行 ---- */
  const lines = text.split(/\n/)
    .map(s => s.replace(/\s+/g, ' ').trim())
    .filter(s => s.length >= 2 && s.length <= 30 && !/^[\d\s.,:：¥￥-]+$/.test(s));

  if(lines.length > 0){
    lines.sort((a, b) => b.length - a.length);
    result.note = lines[0].slice(0, 20);
  }

  return result;
}

/* =========================================================
   记账面板（含编辑）

const entryState = {
  type:'expense', amount:'0', category:'', accountId:'',
  fromId:'', toId:'', date:'', note:''
};

function openEntry(prefill, editId){
  if(state.accounts.length === 0){
    toast('请先在「账户」里添加一个账户');
    return;
  }

  editingId = editId || null;

  if(editId){
    const r = state.records.find(x => x.id === editId);
    if(!r){ toast('记录不存在'); return; }
    entryState.type = r.type;
    entryState.amount = String(r.amount);
    entryState.date = r.date;
    entryState.note = r.note || '';
    if(r.type === 'transfer'){
      entryState.fromId = r.fromId || state.accounts[0].id;
      entryState.toId = r.toId || state.accounts[0].id;
      entryState.category = '';
      entryState.accountId = '';
    }else{
      entryState.category = r.category || CATS[r.type][0];
      entryState.accountId = r.accountId || state.accounts[0].id;
    }
  }else{
    entryState.type = 'expense';
    entryState.amount = '0';
    entryState.category = CATS.expense[0];
    entryState.accountId = state.accounts[0].id;
    entryState.fromId = state.accounts[0].id;
    entryState.toId = (state.accounts[1] || state.accounts[0]).id;
    entryState.date = todayStr();
    entryState.note = '';

    if(prefill){
      if(prefill.amount) entryState.amount = String(prefill.amount);
      if(prefill.date) entryState.date = prefill.date;
      if(prefill.note) entryState.note = prefill.note;
    }
  }

  $('#entrySave').textContent = editId ? '保存修改' : '保存';

  buildKeypad();
  renderEntry();
  $('#entrySheet').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}

function closeEntry(){
  editingId = null;
  $('#entrySave').textContent = '保存';
  $('#entrySheet').classList.add('hidden');
  document.body.style.overflow = '';
}

function buildKeypad(){
  const keys = ['1','2','3','4','5','6','7','8','9','.','0','del'];
  $('#keypad').innerHTML = keys.map(k => {
    if(k === 'del') return '<button class="del" data-act="key" data-val="del">⌫</button>';
    return '<button data-act="key" data-val="' + k + '">' + k + '</button>';
  }).join('');
}

function renderEntry(){
  const es = entryState;

  $$('#entrySeg button').forEach(b => {
    b.classList.toggle('on', b.dataset.val === es.type);
  });

  $('#entryAmount').textContent = es.amount;

  const amt = parseFloat(es.amount);
  $('#entrySave').style.opacity = (amt > 0) ? '1' : '.4';

  let html = '';

  if(es.type === 'transfer'){
    html += '<div class="secTitle">转出账户</div>';
    html += '<div class="chips">' + state.accounts.map(a =>
      '<button data-act="from" data-val="' + a.id + '"' +
      (a.id === es.fromId ? ' class="on"' : '') + '>' + esc(a.name) + '</button>'
    ).join('') + '</div>';

    html += '<div class="secTitle" style="margin-top:18px">转入账户</div>';
    html += '<div class="chips">' + state.accounts.map(a =>
      '<button data-act="to" data-val="' + a.id + '"' +
      (a.id === es.toId ? ' class="on"' : '') + '>' + esc(a.name) + '</button>'
    ).join('') + '</div>';
  }else{
    html += '<div class="secTitle">选择分类</div>';
    html += '<div class="catGrid">' + CATS[es.type].map(c =>
      '<button data-act="cat" data-val="' + c + '"' +
      (c === es.category ? ' class="on"' : '') + '>' +
      '<span class="ci">' + (CAT_ICON[c] || '📦') + '</span>' + c + '</button>'
    ).join('') + '</div>';

    html += '<div class="secTitle" style="margin-top:6px">账户</div>';
    html += '<div class="chips">' + state.accounts.map(a =>
      '<button data-act="acc" data-val="' + a.id + '"' +
      (a.id === es.accountId ? ' class="on"' : '') + '>' + esc(a.name) + '</button>'
    ).join('') + '</div>';
  }

  html += '<div class="fieldRow"><label>日期</label>' +
    '<input type="date" id="entryDate" value="' + es.date + '"></div>';
  html += '<div class="fieldRow"><label>备注</label>' +
    '<input type="text" id="entryNote" placeholder="选填" maxlength="40" value="' +
      esc(es.note) + '"></div>';
  html += '<div style="height:12px"></div>';

  $('#entryBody').innerHTML = html;

  const dEl = document.getElementById('entryDate');
  const nEl = document.getElementById('entryNote');
  dEl.addEventListener('change', () => { entryState.date = dEl.value; });
  nEl.addEventListener('input', () => { entryState.note = nEl.value; });
}

function pressKey(k){
  let a = entryState.amount;

  if(k === 'del'){
    a = a.length > 1 ? a.slice(0, -1) : '0';
  }else if(k === '.'){
    if(a.indexOf('.') === -1) a += '.';
  }else{
    if(a === '0') a = k;
    else{
      const dot = a.indexOf('.');
      if(dot >= 0 && a.length - dot > 2) return;
      if(a.replace('.','').length >= 10) return;
      a += k;
    }
  }

  entryState.amount = a;
  $('#entryAmount').textContent = a;

  const amt = parseFloat(a);
  $('#entrySave').style.opacity = (amt > 0) ? '1' : '.4';
}

function saveEntry(){
  const amt = Math.round((parseFloat(entryState.amount) || 0) * 100) / 100;
  if(!(amt > 0)){ toast('请输入金额'); return; }

  const base = {
    date: entryState.date || todayStr(),
    amount: amt,
    note: (entryState.note || '').trim()
  };

  if(entryState.type === 'transfer'){
    if(entryState.fromId === entryState.toId){
      toast('转出和转入不能是同一账户');
      return;
    }
    Object.assign(base, {
      type: 'transfer',
      fromId: entryState.fromId,
      toId: entryState.toId
    });
  }else{
    Object.assign(base, {
      type: entryState.type,
      category: entryState.category,
      accountId: entryState.accountId
    });
  }

  if(editingId){
    const idx = state.records.findIndex(r => r.id === editingId);
    if(idx >= 0){
      state.records[idx] = Object.assign({}, state.records[idx], base);
    }
    // 编辑后自动展开该日期
    expandedDates[base.date] = true;
    save();
    closeEntry();
    renderCurrent();
    toast('已修改 ' + fmt(amt));
  }else{
    state.records.push(Object.assign({ id: uid() }, base));
    // 新增后自动展开该日期
    expandedDates[base.date] = true;
    save();
    closeEntry();
    renderCurrent();
    toast('已记录 ' + fmt(amt));
  }
}

/* =========================================================
   导出 / 导入
   ========================================================= */
function buildCSV(){
  const rows = [['日期','类型','分类','金额','账户','备注']];
  const sorted = state.records.slice().sort((a,b) =>
    (a.date + a.id).localeCompare(b.date + b.id));

  sorted.forEach(r => {
    if(r.type === 'transfer'){
      rows.push([r.date, '转账', '转账', r.amount,
        accName(r.fromId) + ' → ' + accName(r.toId), r.note || '']);
    }else{
      rows.push([r.date, r.type === 'expense' ? '支出' : '收入',
        r.category, r.amount, accName(r.accountId), r.note || '']);
    }
  });

  return rows.map(row =>
    row.map(cell => '"' + String(cell).replace(/"/g, '""') + '"').join(',')
  ).join('\r\n');
}

async function shareFile(content, filename, mime){
  const blob = new Blob([content], { type: mime });
  const file = new File([blob], filename, { type: mime });

  if(navigator.canShare && navigator.canShare({ files: [file] })){
    try{
      await navigator.share({ files: [file], title: filename });
      return true;
    }catch(e){
      if(e && e.name === 'AbortError') return true;
    }
  }

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 3000);
  return true;
}

function exportCSV(){
  const csv = '\uFEFF' + buildCSV();
  shareFile(csv, '记账_' + todayStr() + '.csv', 'text/csv;charset=utf-8')
    .then(() => toast('已导出 CSV'));
}
function exportJSON(){
  shareFile(JSON.stringify(state, null, 2),
    '记账备份_' + todayStr() + '.json', 'application/json')
    .then(() => toast('备份已导出'));
}

function pickFile(accept, cb){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = accept;
  inp.style.display = 'none';
  inp.addEventListener('change', () => {
    const f = inp.files && inp.files[0];
    if(f) cb(f);
    setTimeout(() => inp.remove(), 1000);
  });
  document.body.appendChild(inp);
  inp.click();
}

function importJSON(){
  pickFile('.json,application/json', file => {
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const obj = JSON.parse(reader.result);
        if(!obj || !Array.isArray(obj.records) || !Array.isArray(obj.accounts)){
          throw new Error('格式不对');
        }
        if(!confirm('导入将覆盖当前全部数据，确定继续？\n（当前 ' +
            state.records.length + ' 条 → 备份中 ' + obj.records.length + ' 条）')) return;

        state = {
          settings: Object.assign({ pin:'', lock:false, budget:0 }, obj.settings || {}),
          accounts: obj.accounts,
          records: obj.records
        };
        if(state.accounts.length === 0) state.accounts = defaultState().accounts;
        expandedDates = {};
        save();
        renderAll();
        toast('导入成功，共 ' + state.records.length + ' 条');
      }catch(e){
        alert('导入失败：' + (e.message || '文件无法解析'));
      }
    };
    reader.readAsText(file, 'utf-8');
  });
}

function parseCSV(text){
  text = text.replace(/^\uFEFF/, '');
  const rows = [];
  let row = [], cell = '', inQ = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(inQ){
      if(c === '"'){
        if(text[i+1] === '"'){ cell += '"'; i++; }
        else inQ = false;
      }else cell += c;
    }else{
      if(c === '"') inQ = true;
      else if(c === ','){ row.push(cell); cell = ''; }
      else if(c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
      else if(c === '\r'){ /* skip */ }
      else cell += c;
    }
  }
  if(cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim() !== ''));
}

function importCSV(){
  pickFile('.csv,text/csv', file => {
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const rows = parseCSV(reader.result);
        if(rows.length < 2) throw new Error('文件没有数据行');

        const head = rows[0].map(h => String(h).trim());
        const idx = name => head.indexOf(name);
        const iDate = idx('日期'), iType = idx('类型'), iCat = idx('分类');
        const iAmt = idx('金额'), iAcc = idx('账户'), iNote = idx('备注');

        if(iDate < 0 || iAmt < 0) throw new Error('缺少「日期」或「金额」列');

        const accMap = {};
        state.accounts.forEach(a => { accMap[a.name] = a.id; });
        function accIdOf(name){
          name = (name || '').trim() || '现金';
          if(accMap[name]) return accMap[name];
          const na = { id: uid(), name: name, initial: 0 };
          state.accounts.push(na);
          accMap[name] = na.id;
          return na.id;
        }

        let added = 0, skipped = 0;
        rows.slice(1).forEach(r => {
          const date = String(r[iDate] || '').trim().replace(/\//g, '-');
          const amt  = parseFloat(String(r[iAmt] || '').replace(/[^\d.\-]/g, ''));
          const type = iType >= 0 ? String(r[iType] || '').trim() : '支出';
          if(!/^\d{4}-\d{1,2}-\d{1,2}$/.test(date) || !(amt > 0)){ skipped++; return; }
          const p = date.split('-');
          const d = p[0] + '-' + p[1].padStart(2,'0') + '-' + p[2].padStart(2,'0');

          if(type === '转账'){
            state.records.push({
              id: uid(), date: d, type: 'transfer', amount: amt,
              fromId: state.accounts[0].id, toId: state.accounts[0].id,
              note: iNote >= 0 ? String(r[iNote] || '') : ''
            });
          }else{
            state.records.push({
              id: uid(), date: d,
              type: type === '收入' ? 'income' : 'expense',
              amount: amt,
              category: (iCat >= 0 && String(r[iCat] || '').trim()) || '其他',
              accountId: iAcc >= 0 ? accIdOf(String(r[iAcc] || '')) : state.accounts[0].id,
              note: iNote >= 0 ? String(r[iNote] || '') : ''
            });
          }
          added++;
        });

        save();
        renderAll();
        alert('导入完成\n成功：' + added + ' 条' + (skipped ? '\n跳过：' + skipped + ' 条' : ''));
      }catch(e){
        alert('导入失败：' + (e.message || '无法解析'));
      }
    };
    reader.readAsText(file, 'utf-8');
  });
}

/* =========================================================
   账户操作
   ========================================================= */
function addAccount(){
  const name = prompt('账户名称（如：招商银行、余额宝）');
  if(!name || !name.trim()) return;
  const initStr = prompt('初始余额（可留空或填 0，欠款填负数）', '0');
  const initial = parseFloat(initStr) || 0;
  state.accounts.push({ id: uid(), name: name.trim(), initial: initial });
  save();
  renderAccount();
  toast('已添加「' + name.trim() + '」');
}

function renameAccount(id){
  const acc = state.accounts.find(a => a.id === id);
  if(!acc) return;
  const name = prompt('修改账户名称', acc.name);
  if(name === null) return;
  const initStr = prompt('修改初始余额', String(acc.initial || 0));
  if(initStr === null) return;
  if(name.trim()) acc.name = name.trim();
  acc.initial = parseFloat(initStr) || 0;
  save();
  renderAccount();
  toast('已保存');
}

function delAccount(id){
  const acc = state.accounts.find(a => a.id === id);
  if(!acc) return;
  if(state.accounts.length <= 1){ alert('至少保留一个账户'); return; }
  const used = state.records.filter(r =>
    r.accountId === id || r.fromId === id || r.toId === id).length;
  if(!confirm('删除账户「' + acc.name + '」？' +
    (used ? '\n该账户关联了 ' + used + ' 条记录，这些记录也会一并删除。' : ''))) return;
  state.accounts = state.accounts.filter(a => a.id !== id);
  state.records = state.records.filter(r =>
    r.accountId !== id && r.fromId !== id && r.toId !== id);
  save();
  renderAccount();
  renderHome();
  toast('已删除');
}

function delRecord(id){
  const r = state.records.find(x => x.id === id);
  if(!r) return;
  if(!canEditDate(r.date)){
    toast('超过 3 天的记录不可修改');
    return;
  }
  if(!confirm('删除这条记录？')) return;
  state.records = state.records.filter(x => x.id !== id);
  save();
  renderCurrent();
  toast('已删除');
}

/* =========================================================
   月份切换
   ========================================================= */
function shiftMonth(delta){
  const p = curMonth.split('-');
  const d = new Date(Number(p[0]), Number(p[1]) - 1 + delta, 1);
  curMonth = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  renderHome();
}

/* =========================================================
   锁屏
   ========================================================= */
let lockInput = '';

function renderLock(){
  const pad = $('#lockPad');
  const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
  pad.innerHTML = keys.map(k => {
    if(k === '') return '<button class="blank"></button>';
    return '<button data-k="' + k + '">' + k + '</button>';
  }).join('');

  pad.onclick = e => {
    const b = e.target.closest('button[data-k]');
    if(!b) return;
    const k = b.dataset.k;
    if(k === '⌫') lockInput = lockInput.slice(0, -1);
    else if(lockInput.length < 4) lockInput += k;
    updateDots();
    if(lockInput.length === 4) setTimeout(checkPin, 120);
  };
}

function updateDots(){
  const dots = $('#lockDots').children;
  for(let i = 0; i < 4; i++){
    dots[i].classList.toggle('f', i < lockInput.length);
  }
}

function checkPin(){
  if(hash(lockInput) === state.settings.pin){
    $('#lockScreen').classList.add('hidden');
    lockInput = '';
    updateDots();
  }else{
    lockInput = '';
    updateDots();
    toast('密码错误');
    if(navigator.vibrate) navigator.vibrate(60);
  }
}

/* =========================================================
   事件总控
   ========================================================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  const val = el.dataset.val;

  switch(act){
    case 'tab':        switchTab(val); break;
    case 'fab':        openEntry(); break;
    case 'prevMonth':  shiftMonth(-1); break;
    case 'nextMonth':  shiftMonth(1); break;

    /* 折叠展开 */
    case 'toggleDay': {
      const date = val;
      const cur = (expandedDates[date] !== undefined)
        ? expandedDates[date]
        : (date === todayStr());
      expandedDates[date] = !cur;
      renderHome();
      break;
    }

    /* 编辑记录 */
    case 'editRec': {
      const r = state.records.find(x => x.id === val);
      if(!r){ toast('记录不存在'); break; }
      if(!canEditDate(r.date)){ toast('超过 3 天的记录不可修改'); break; }
      openEntry(null, r.id);
      break;
    }

    case 'entryType':
      entryState.type = val;
      if(val === 'transfer'){
        if(entryState.fromId === entryState.toId){
          entryState.toId = (state.accounts.find(a => a.id !== entryState.fromId) || {}).id
                            || entryState.fromId;
        }
      }else{
        entryState.category = CATS[val][0];
      }
      renderEntry();
      break;

    case 'key':        pressKey(val); break;
    case 'saveEntry':  saveEntry(); break;
    case 'closeEntry': closeEntry(); break;
    case 'ocr':        document.getElementById('ocrFile').click(); break;

    case 'cat':  entryState.category = val; renderEntry(); break;
    case 'acc':  entryState.accountId = val; renderEntry(); break;
    case 'from': entryState.fromId = val; renderEntry(); break;
    case 'to':   entryState.toId = val; renderEntry(); break;

    case 'delRec':     delRecord(val); break;
    case 'addAcc':     addAccount(); break;
    case 'renameAcc':  renameAccount(val); break;
    case 'delAcc':     delAccount(val); break;

    case 'exportCsv':  exportCSV(); break;
    case 'exportJson': exportJSON(); break;
    case 'importJson': importJSON(); break;
    case 'importCsv':  importCSV(); break;

    case 'changePin': {
      const p = prompt('请输入当前密码：');
      if(hash(p || '') !== state.settings.pin){ toast('密码错误'); break; }
      const n1 = prompt('设置新的 4 位数字密码：');
      if(!n1 || !/^\d{4}$/.test(n1)){ toast('必须是 4 位数字'); break; }
      state.settings.pin = hash(n1);
      save();
      toast('密码已修改');
      break;
    }

    case 'clearAll':
      if(confirm('确定清空所有数据？此操作不可恢复！\n建议先「导出完整备份」。')){
        if(confirm('真的确定吗？所有记录和账户都会被删除。')){
          const keepLock = state.settings;
          state = defaultState();
          state.settings = keepLock;
          expandedDates = {};
          save();
          renderAll();
          toast('已清空');
        }
      }
      break;
  }
});

/* OCR 文件选择 */
document.getElementById('ocrFile').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if(f) startOCR(f);
  e.target.value = '';
});

function switchTab(name){
  $$('#tabbar button').forEach(b =>
    b.classList.toggle('on', b.dataset.val === name));
  $$('.page').forEach(p =>
    p.classList.toggle('active', p.id === 'page-' + name));
  renderCurrent();
  window.scrollTo(0, 0);
}

function renderCurrent(){
  const active = document.querySelector('.page.active');
  if(!active) return;
  switch(active.id){
    case 'page-home':    renderHome(); break;
    case 'page-chart':   renderChart(); break;
    case 'page-account': renderAccount(); break;
    case 'page-setting': renderSetting(); break;
  }
}

function renderAll(){
  renderHome();
  renderAccount();
  renderSetting();
  if(document.querySelector('.page.active') &&
     document.querySelector('.page.active').id === 'page-chart'){
    renderChart();
  }
}

/* =========================================================
   启动
   ========================================================= */
(function init(){
  if(!localStorage.getItem(KEY)){
    state = defaultState();
    save();
  }

  renderAll();

  if(state.settings.lock && state.settings.pin){
    $('#lockScreen').classList.remove('hidden');
    lockInput = '';
    updateDots();
    renderLock();
  }

  document.addEventListener('gesturestart', e => e.preventDefault());

  document.addEventListener('visibilitychange', () => {
    if(!document.hidden){
      const t = todayStr().slice(0,7);
      if(t !== curMonth){ curMonth = t; renderCurrent(); }
      else if(document.querySelector('.page.active') &&
              document.querySelector('.page.active').id === 'page-home'){
        renderHome();
      }
    }
  });
})();
</script>
